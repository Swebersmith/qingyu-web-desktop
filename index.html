<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9eced" />
    <meta name="description" content="Weboss · 属于自己的 Web 平板桌面" />
    <title>Weboss</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
    <div class="wallpaper-tint" aria-hidden="true"></div>

    <div class="desktop-shell" id="desktopShell">
      <header class="topbar">
        <div class="top-context"><span id="topPageName">首页</span><span class="top-context-separator">·</span><span id="topDate"></span></div>
        <div class="top-actions">
          <button class="round-action cloud-sync-button" id="cloudSyncButton" type="button" title="云同步" aria-label="云同步" data-phase="off">☁</button>
          <button class="top-tool" id="undoOrganize" type="button" hidden>撤销整理</button>
          <button class="top-tool" id="organizeButton" type="button" title="AI 自动整理" aria-label="AI 自动整理">✧ <span>自动整理</span></button>
          <button class="round-action" id="batchButton" type="button" title="批量整理 App" aria-label="批量整理 App">☑</button>
          <button class="round-action" id="editModeButton" type="button" title="整理桌面" aria-label="整理桌面">✦</button>
        </div>
      </header>

      <main class="desktop-viewport" id="desktopViewport" aria-label="桌面页面">
        <div class="page-track" id="pageTrack"></div>
      </main>

      <div class="bottom-system">
        <button class="search-pill" id="searchTrigger" type="button" aria-haspopup="dialog" aria-label="打开搜索">
          <span class="search-glyph" aria-hidden="true">⌕</span>
          <span>搜索 App、网站或直接上网</span>
          <kbd>⌘ K</kbd>
        </button>
        <nav class="page-dots" id="pageDots" aria-label="切换桌面页面"></nav>
        <nav class="dock" id="dock" aria-label="快捷 Dock"></nav>
      </div>
    </div>

    <div class="app-context-menu" id="appContextMenu" role="menu" aria-label="快捷方式操作" hidden></div>

    <div class="search-overlay" id="searchOverlay" aria-hidden="true">
      <div class="search-backdrop" id="searchBackdrop"></div>
      <section class="search-panel" role="dialog" aria-modal="true" aria-label="快捷搜索">
        <div class="search-field">
          <span class="search-glyph" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索 App、网站，或输入关键词…" aria-label="搜索" />
          <button id="searchClose" type="button" aria-label="关闭搜索">Esc</button>
        </div>
        <div class="search-body">
          <p class="section-eyebrow" id="searchResultLabel">常用捷径</p>
          <div id="searchResults" class="search-results"></div>
        </div>
        <div class="engine-bar"><span>使用搜索引擎</span><div id="engineChoices"></div></div>
      </section>
    </div>

    <div class="window-overlay" id="settingsOverlay" aria-hidden="true"><div class="window-backdrop" id="settingsBackdrop"></div></div>
    <dialog class="settings-dialog morph-surface" id="settingsDialog" aria-label="Weboss 设置">
      <div class="settings-frame">
        <header class="settings-head">
          <div><p class="section-eyebrow">WEBOSS</p><h2>桌面设置</h2></div>
          <button class="icon-button" id="settingsClose" type="button" aria-label="关闭设置">×</button>
        </header>
        <nav class="settings-tabs" id="settingsTabs" aria-label="设置分类">
          <button type="button" data-tab="apps" class="active">App</button>
          <button type="button" data-tab="widgets">Widget</button>
          <button type="button" data-tab="folders">文件夹</button>
          <button type="button" data-tab="todos">今日计划</button>
          <button type="button" data-tab="dock">Dock</button>
          <button type="button" data-tab="appearance">外观</button>
          <button type="button" data-tab="sync">云同步</button>
          <button type="button" data-tab="data">数据</button>
        </nav>
        <div class="settings-content" id="settingsContent"></div>
      </div>
    </dialog>

    <div class="window-overlay" id="folderOverlay" aria-hidden="true"><div class="window-backdrop" id="folderBackdrop"></div></div>
    <dialog class="folder-dialog morph-surface" id="folderDialog" aria-label="文件夹">
      <div class="folder-frame">
        <header class="folder-head"><div><p class="section-eyebrow">APP COLLECTION</p><h2 id="folderTitle" tabindex="-1"></h2><input id="folderName" hidden maxlength="32" aria-label="文件夹名称" /></div><button class="icon-button" id="folderClose" type="button" aria-label="关闭文件夹">×</button></header>
        <div class="folder-hint"><span>拖动排序 · 拖出放回桌面</span><div><button class="chip-button" id="folderRename" type="button">重命名</button><button class="chip-button" id="folderBatch" type="button">多选</button><button class="chip-button" id="folderManage" type="button">添加 / 编辑</button></div></div>
        <div class="folder-app-grid" id="folderGrid"></div>
        <nav class="folder-pagination" id="folderPagination" aria-label="文件夹分页"></nav>
      </div>
    </dialog>

    <div class="window-overlay" id="widgetOverlay" aria-hidden="true"><div class="window-backdrop" id="widgetBackdrop"></div></div>
    <dialog class="widget-dialog morph-surface" id="widgetDialog" aria-label="小组件详情">
      <div class="widget-frame">
        <header class="settings-head"><div><p class="section-eyebrow">A LITTLE MORE OF YOUR DAY</p><h2 id="widgetTitle" tabindex="-1">小组件详情</h2></div><button class="icon-button" id="widgetClose" type="button" aria-label="关闭小组件详情">×</button></header>
        <div class="widget-detail-body" id="widgetDetails"></div>
        <footer class="widget-detail-footer"><span id="widgetDetailHint">你的生活，在这里继续</span><button class="button-secondary" id="widgetManage" type="button">编辑小组件</button></footer>
      </div>
    </dialog>

    <div class="window-overlay" id="organizerOverlay" aria-hidden="true"><div class="window-backdrop" id="organizerBackdrop"></div></div>
    <dialog class="organizer-dialog morph-surface" id="organizerDialog" aria-label="整理 App">
      <div class="organizer-frame">
        <header class="settings-head"><div><p class="section-eyebrow">MAKE ROOM FOR WHAT YOU LOVE</p><h2>整理你的桌面</h2></div><button class="icon-button" id="organizerClose" type="button" aria-label="关闭整理">×</button></header>
        <nav class="organizer-tabs" aria-label="整理方式"><button type="button" id="organizerBulkTab">批量整理</button><button type="button" id="organizerAITab">✧ AI 自动整理</button></nav>
        <div class="organizer-controls"><label>范围 <select id="organizerScope" aria-label="整理范围"></select></label><input id="organizerFilter" type="search" placeholder="查找 App…" aria-label="筛选 App" /><label class="organizer-existing"><input id="organizerExisting" type="checkbox" />包含已有文件夹</label></div>
        <label id="organizerPreference" class="organizer-preference" hidden><span>告诉 AI 你想怎么整理</span><input id="organizerInstruction" type="text" maxlength="300" aria-label="AI 整理偏好" placeholder="例如：学习和开发分开，音乐单独一组，文件夹少一点" /></label>
        <div class="organizer-content" id="organizerContent"></div>
        <footer class="organizer-footer" id="organizerFooter"></footer>
      </div>
    </dialog>

    <dialog class="editor-dialog" id="editorDialog" aria-label="编辑项目">
      <form id="editorForm" method="dialog">
        <header><h2 id="editorTitle">编辑</h2><button class="icon-button" id="editorClose" type="button" aria-label="关闭">×</button></header>
        <div id="editorFields"></div>
        <footer><button id="editorDelete" class="text-danger" type="button">删除</button><span></span><button class="button-secondary" id="editorCancel" type="button">取消</button><button class="button-primary" type="submit">保存</button></footer>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./config.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
